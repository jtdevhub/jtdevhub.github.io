<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jtdevhub</title>
<style>
  :root { --bg:#120b1c; --fg:#e9e4f5; --muted:#b4abcc; --gold:#ffd680; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { color:var(--gold); margin:0 0 4px; }
  p.sub { color:var(--muted); margin-top:0; }
  .game { display:flex; gap:20px; align-items:center; margin-top:40px; padding:20px; border:1px solid #3a2d52; border-radius:12px; }
  .game img { width:96px; height:96px; image-rendering:pixelated; border-radius:20px; flex-shrink:0; }
  .game h2 { margin:0; color:var(--gold); font-size:1.2rem; }
  a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <h1>jtdevhub</h1>
  <p class="sub">Juegos indie · Indie games</p>

  <div class="game">
    <img src="icono.png" alt="Icono de Sköll">
    <div>
      <h2>Sköll: Runas del Sol</h2>
      <p>Libera las runas del Sol que devoró Sköll. Puzzle de flechas oscuro e infinito.<br>
      <em>Free the runes of the Sun that Sköll devoured. A dark, endless arrow puzzle.</em></p>
      <p><a href="privacidad.html">Política de privacidad · Privacy policy</a></p>
    </div>
  </div>
</main>
</body>
</html>
